extends: base://ubuntu
devcontainer:
  publish:
    image: dcc://ubuntu
    labels:
      org.opencontainers.image.description: VSCode devcontainer for ubuntu
      org.opencontainers.image.source: https://github.com/dhhyi/devcontainer-creator
  build:
    files:
      - type: file
        path: /etc/fish/conf.d/mise.fish
        content: |
          if type -q mise
            mise activate fish | source
          end
      - type: file
        path: $HOME/.config/fish/conf.d/mise.fish
        content: |
          if type -q mise
            mise activate fish | source
          end
    root:
      - SHELL ["/usr/bin/env", "fish", "-c"]
