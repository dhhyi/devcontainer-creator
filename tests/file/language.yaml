devcontainer:
  build:
    files:
      - type: script
        path: /usr/local/bin/testme
        content: echo 'Hello World!'
      - type: file
        path: ${HOME}/.config/test/test.file
        content: EMPTY
      - type: file
        path: ${HOME}/.config/test/test.base64
        base64: SGVsbG8gQmFzZTY0IQ==
  selftest: |
    testme
    stat $HOME/.config/test/test.file
    stat $HOME/.config/test/test.base64
