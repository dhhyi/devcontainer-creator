extends: dcc://debian
devcontainer:
  name: "Complex Extended"
  selftest: echo 'Hello Extended!'
  build:
    root:
      - RUN echo Hello from the build stage
vscode:
  settings:
    foo: bar
    array:
      - path: /usr/local/bin
        extensions: [ts, js]
      - path: /usr/bin
        extensions: [py]
  tasks:
    - label: Say Hi
      command: echo 'Hi!'
