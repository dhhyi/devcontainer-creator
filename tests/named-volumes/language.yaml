extends: dcc://debian
devcontainer:
  selftest: |
    mkdir -p $HOME/project
    cd $HOME/project
    mkdir -p build
    echo "cached artifact" > build/artifact.txt
    cat build/artifact.txt
extras:
  - named-volumes
namedVolumes:
  build: dcc-test-build-cache
  $HOME/.cache/tool: dcc-test-tool-cache
  /opt/tool/cache: dcc-test-opt-tool-cache
