extends: dcc://debian
devcontainer:
  build:
    args:
      APP_VERSION: "22"
      TOOL_VER: 7
    prepare:
      - ARG APP_VERSION
      - RUN echo preparing-$APP_VERSION
    packages:
      - ripgrep
      - fd-find
    root:
      - ARG TOOL_VER
      - RUN echo root-$TOOL_VER
    user:
      - ARG HOME_SETUP
      - RUN echo user-home-$HOME_SETUP
