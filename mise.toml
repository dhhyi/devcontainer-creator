[tools]
node = "24"
pnpm = "latest"
python = "latest"

[hooks]
postinstall = '''
if [ -x "$HOME/.local/share/pnpm/bin/pnpm" ] && [ -x "$HOME/.local/share/pnpm/bin/pnpx" ]; then
	echo "pnpm already set up"
else
	pnpm setup
fi
if command -v devcontainer >/dev/null 2>&1; then
	echo "devcontainer CLI already installed"
else
	pnpm add -g npm:@devcontainers/cli
fi
if command -v cram >/dev/null 2>&1; then
	echo "cram already installed"
else
	python3 -m pip install --user cram==0.7
fi
if command -v jq >/dev/null 2>&1; then
	echo "jq already installed"
elif command -v apt-get >/dev/null 2>&1; then
	sudo apt-get update
	sudo apt-get install -y jq
else
	echo "jq is required but no supported package manager found"
	exit 1
fi
'''

[settings]
experimental = true

[settings.npm]
package_manager = "pnpm"

[env]
_.path = { path = ["{{env.HOME}}/.local/share/pnpm/bin", "{{env.HOME}}/.local/bin"] }
DCC_EXEC = "node {{config_root}}/dist/bundle.js"
