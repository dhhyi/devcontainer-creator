# This file is generated by pipeline.js
name: Publish
concurrency:
  group: publish
  cancel-in-progress: false
on:
  push:
    branches:
      - main
jobs:
  calc:
    runs-on: ubuntu-latest
    outputs:
      buildLanguages: ${{ steps.calculate.outputs.buildLanguages }}
      buildBase: ${{ steps.calculate.outputs.buildBase }}
      dccDebian: ${{ steps.calculate.outputs.dccDebian }}
      dccLualatex: ${{ steps.calculate.outputs.dccLualatex }}
      dccUbuntu: ${{ steps.calculate.outputs.dccUbuntu }}
    env:
      commits: ${{ toJSON(github.event.commits) }}
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - run: pnpm i --ignore-scripts
        name: pnpm install
      - run: |-
          pnpm run lint
          pnpm run format
          pnpm run synchronize-ci
          git diff --exit-code
        name: Check Integrity
      - run: |-
          noOfCommits=$(echo $commits | jq ". | length")
          git diff --name-only HEAD~$noOfCommits
        name: Report Changed Files
      - id: calculate
        run: >-
          noOfCommits=$(echo $commits | jq ". | length")

          git diff --name-only HEAD~$noOfCommits | node check-lang-ci.js >>
          $GITHUB_OUTPUT

          cat $GITHUB_OUTPUT
        name: Calculate Required Jobs
  bundle:
    uses: ./.github/workflows/bundle.yaml
    secrets: inherit
  features:
    needs:
      - calc
    if: ${{ ! failure() && ! cancelled() && always() }}
    uses: ./.github/workflows/features.yaml
    with:
      skip: ${{ needs.calc.outputs.buildBase == 'false' }}
    secrets: inherit
  baseDebian:
    needs:
      - calc
      - features
    if: ${{ ! failure() && ! cancelled() && always() }}
    name: base://debian
    uses: ./.github/workflows/base.yaml
    with:
      name: debian
      skip: ${{ needs.calc.outputs.buildBase == 'false' }}
    secrets: inherit
  baseUbuntu:
    needs:
      - calc
      - features
    if: ${{ ! failure() && ! cancelled() && always() }}
    name: base://ubuntu
    uses: ./.github/workflows/base.yaml
    with:
      name: ubuntu
      skip: ${{ needs.calc.outputs.buildBase == 'false' }}
    secrets: inherit
  dccDebian:
    needs:
      - calc
      - bundle
      - baseDebian
    if: ${{ ! failure() && ! cancelled() && always() }}
    name: dcc://debian
    uses: ./.github/workflows/dcc.yaml
    with:
      name: debian
      skip: ${{ needs.calc.outputs.dccDebian == 'false' }}
    secrets: inherit
  dccLualatex:
    needs:
      - calc
      - bundle
      - dccDebian
    if: ${{ ! failure() && ! cancelled() && always() }}
    name: dcc://lualatex
    uses: ./.github/workflows/dcc.yaml
    with:
      name: lualatex
      skip: ${{ needs.calc.outputs.dccLualatex == 'false' }}
    secrets: inherit
  dccUbuntu:
    needs:
      - calc
      - bundle
      - baseUbuntu
    if: ${{ ! failure() && ! cancelled() && always() }}
    name: dcc://ubuntu
    uses: ./.github/workflows/dcc.yaml
    with:
      name: ubuntu
      skip: ${{ needs.calc.outputs.dccUbuntu == 'false' }}
    secrets: inherit
  examples:
    needs:
      - calc
      - dccDebian
      - dccLualatex
      - dccUbuntu
    if: ${{ ! failure() && ! cancelled() && always() }}
    uses: ./.github/workflows/examples.yaml
    with:
      skip: ${{ needs.calc.outputs.buildLanguages == 'false' }}
    secrets: inherit
